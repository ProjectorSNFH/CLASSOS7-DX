<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DATA SERVER MASTER CONTROL</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; line-height: 1.5; }
        #output { white-space: pre-wrap; margin-bottom: 20px; color: #00ff41; }
        .input-line { display: flex; color: #00ff41; }
        input { background: transparent; border: none; color: #00ff41; font-family: inherit; font-size: 1rem; outline: none; flex: 1; }
        .status-bar { border-bottom: 1px solid #00ff41; padding-bottom: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="status-bar">DATA SERVER MASTER TERMINAL v1.0 [STATUS: ONLINE]</div>
    <div id="output">SYSTEM READY...
TYPE 'serv login' TO ACCESS COMMANDS.</div>

    <div class="input-line">
        <span>MASTER@DATA_SERVER:~$ </span>
        <input type="text" id="consoleInput" autofocus autocomplete="off">
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('consoleInput');
        let masterPassword = "";
        let isAuthorized = false;
        let isWaitingPassword = false;

        function print(text) {
            output.innerText += "\n" + text;
            window.scrollTo(0, document.body.scrollHeight);
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const val = input.value.trim();
                input.value = "";
                if (!val) return;

                // 1. 로그인 상태 제어
                if (val === "serv login") {
                    if (isAuthorized) { print("> Already Login"); return; }
                    isWaitingPassword = true;
                    print("> Enter the Passwords");
                    return;
                }

                if (val === "serv logout") {
                    if (!isAuthorized) { print("> Already Logout"); return; }
                    isAuthorized = false;
                    masterPassword = "";
                    print("> Login Terminated. Access Revoked.");
                    return;
                }

                if (!isAuthorized && !isWaitingPassword) {
                    print(`> ${val}\nACCESS DENIED: PLEASE LOGIN FIRST.`);
                    return;
                }

                // 2. 서버 통신 (api/auth/masterControl 호출)
                try {
                    const response = await fetch("/api/auth/masterControl", {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            password: isWaitingPassword ? val : masterPassword,
                            command: isWaitingPassword ? "" : val
                        })
                    });
                    const result = await response.text();

                    if (isWaitingPassword) {
                        if (result.includes("READY")) {
                            masterPassword = val;
                            isAuthorized = true;
                            isWaitingPassword = false;
                            print("Login Accepted. Welcome Master.");
                        } else {
                            isWaitingPassword = false;
                            print("Invalid passwords");
                        }
                    } else {
                        print(`> ${val}\n${result}`);
                    }
                } catch (err) {
                    print("ERROR: DATA SERVER UNREACHABLE.");
                }
            }
        });
    </script>
</body>
</html>
